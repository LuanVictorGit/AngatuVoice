name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Version from the tag
        id: v
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          $channel = if ($version -match '-') { 'beta' } else { 'stable' }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          $pom = ([xml](Get-Content pom.xml)).project.version
          if ($pom -ne $version) { throw "A tag v$version não bate com a versão $pom do pom.xml. Atualize o pom.xml e o CHANGELOG.md antes de criar a tag." }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) { throw "O CHANGELOG.md não tem a seção [$version]." }
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## \[" | Where-Object { $_ -like "$version]*" } | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          ("## [" + $notes).Trim() | Set-Content dist\notes.md -Encoding utf8

      - name: Tests
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: App image and update package
        shell: pwsh
        run: ./tools/package.ps1 -Version '${{ steps.v.outputs.version }}'

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\angatu-voice.iss

      - name: Signed manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $notes = "dist\notes.md"
          java tools/Release.java '${{ steps.v.outputs.version }}' '${{ steps.v.outputs.channel }}' "dist\AngatuVoice-${{ steps.v.outputs.version }}-win-x64.zip" '${{ github.repository }}' '1.0.0' dist $notes

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @(); if ('${{ steps.v.outputs.channel }}' -eq 'beta') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' @flags --title 'Angatu Voice ${{ steps.v.outputs.version }}' --notes-file dist\notes.md `
            "dist\AngatuVoice-${{ steps.v.outputs.version }}-win-x64.zip" `
            "dist\AngatuVoice-Setup.exe" `
            dist\manifest.json dist\manifest.json.sig