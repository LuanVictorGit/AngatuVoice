<div id="boot" class="boot" role="status" aria-live="polite">
  <img src="/assets/icon-256.png" width="72" height="72" alt="" draggable="false">
  <div class="boot-title">Angatu Voice</div>
  <div id="boot-text" class="boot-text">Carregando suas conversas…</div>
  <div class="boot-bar" aria-hidden="true"><i></i></div>
</div><div id="shell" class="grid h-screen grid-cols-[72px_1fr] grid-rows-[1fr_64px] bg-bg0 text-ink md:grid-cols-[256px_1fr] xl:grid-cols-[256px_1fr_248px]">
  <aside class="row-span-1 flex min-h-0 flex-col border-r border-line bg-bg1">
    <div class="flex h-14 items-center gap-3 px-4">
      <img src="/assets/icon-64.png" width="28" height="28" alt="" draggable="false">
      <span class="hidden text-base font-bold tracking-tight md:inline">Angatu Voice</span>
    </div>
    <nav id="nav" class="flex min-h-0 flex-1 flex-col overflow-y-auto px-2 pb-2" aria-label="Conversas"></nav>
    <div class="border-t border-line p-2">
      <button id="btn-open-settings" class="nav-item"><svg class="ic"><use href="#i-settings"/></svg><span class="hidden md:inline">Configurações</span></button>
      <a id="brand-link" class="brand-mark mt-2 flex items-center gap-2 rounded-md px-2 pb-1 pt-3 md:px-3" href="https://angatusistemas.com.br" target="_blank" rel="noopener" title="Abrir o site da Angatu Sistemas">
        <span class="hidden brand-label md:inline">Desenvolvido por</span>
        <img class="brand-on-dark brand-logo" src="/assets/angatu-sistemas.png" width="76" height="26" alt="Angatu Sistemas" draggable="false">
        <img class="brand-on-light brand-logo" src="/assets/angatu-sistemas-escuro.png" width="76" height="26" alt="Angatu Sistemas" draggable="false">
      </a>
    </div>
  </aside>

  <main id="main-col" class="flex min-h-0 min-w-0 flex-col bg-bg0">
    <div id="banners"></div>
    <header class="flex h-14 flex-none items-center gap-2 border-b border-line px-3 md:gap-3 md:px-5">
      <div id="chat-title" class="min-w-0 flex-1 truncate text-base font-bold"></div>
      <div id="chat-tools" class="flex flex-none items-center gap-1 md:gap-2"></div>
    </header>
    <section id="call-panel" class="hidden max-h-[55vh] flex-none overflow-y-auto border-b border-line bg-bg1 p-4"></section>
    <div id="chat-pane">
      <section id="pins-panel" class="pins-panel" aria-label="Mensagens fixadas" hidden></section>
      <section id="messages" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden pb-2 pt-3" aria-label="Mensagens">
        <div id="msg-list" role="log" aria-live="polite" aria-relevant="additions"></div>
      </section>
      <div id="chat-jump" class="jump-bar" role="status" hidden></div>
      <footer id="composer-area" class="flex-none px-3 pb-2 pt-1 md:px-5">
        <div id="emoji-panel" class="emoji-panel card" hidden></div>
        <div id="composer-suggest" class="suggest card" role="listbox" aria-label="Sugestões" hidden></div>
        <div id="composer-box" class="card composer-box">
          <div id="composer-reply" class="composer-reply" hidden></div>
          <div id="composer-files" class="composer-files" hidden></div>
          <div id="composer-row" class="flex items-end gap-1 p-1.5">
            <div id="voice-strip" class="voice-strip" aria-live="polite"></div>
            <button id="btn-attach" class="btn btn-ghost btn-icon" title="Anexar arquivo" aria-label="Anexar arquivo"><svg class="ic"><use href="#i-paperclip"/></svg></button>
            <textarea id="composer" class="input min-w-0 flex-1 border-0 bg-transparent" rows="1" maxlength="200000" placeholder="Escreva uma mensagem" aria-label="Mensagem"></textarea>
            <button id="btn-emoji" class="btn btn-ghost btn-icon" title="Emojis" aria-label="Emojis"><svg class="ic"><use href="#i-smile"/></svg></button>
            <button id="btn-send" class="btn btn-primary btn-icon" title="Enviar" aria-label="Enviar"><svg class="ic"><use href="#i-send"/></svg></button>
            <button id="btn-mic" class="btn btn-ghost btn-icon voice-mic-btn" title="Segure para gravar uma mensagem de voz, ou clique para gravar sem segurar" aria-label="Gravar mensagem de voz"><svg class="ic"><use href="#i-mic"/></svg></button>
          </div>
        </div>
        <div class="flex h-5 items-center gap-3 px-1 text-xs text-faint">
          <div id="typing-line" class="typing-line min-w-0 flex-1 truncate" aria-live="polite"></div>
          <div class="hidden lg:block">Enter envia · Shift + Enter quebra linha · Ctrl + K troca de conversa</div>
        </div>
        <input id="file-input" type="file" multiple hidden>
      </footer>
    </div>
  </main>

  <aside id="members" class="hidden min-h-0 flex-col overflow-y-auto border-l border-line bg-bg1 p-3 xl:flex" aria-label="Participantes"></aside>

  <div id="bottombar" class="col-span-full flex items-center gap-3 border-t border-line bg-bg1 px-3"></div>
</div>
<div id="incoming" class="incoming-host" aria-live="assertive"></div>
<div id="toasts" class="toast-host" aria-live="polite"></div>
<div id="overlay-root"></div>
<div id="audio-root" hidden></div>
