<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Angatu Voice</title>
  <style>
    :root { --bg: #0f0e0d; --ink: #ece7e0; --muted: #a39c92; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; box-sizing: border-box; }
    p { color: var(--muted); }
    footer { margin-top: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
    a { display: flex; }
  </style>
</head>
<body>
  <main>
    <h1>Angatu Voice</h1>
    <p>Este endereço só transmite telas compartilhadas dentro do aplicativo.</p>
    <footer>
      Desenvolvido por
      <a href="https://angatusistemas.com.br" target="_blank" rel="noopener"><img src="/assets/angatu-sistemas.png" width="76" height="26" alt="Angatu Sistemas"></a>
    </footer>
  </main>
</body>
</html>
