services:
  relay:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - TURN_SECRET=${TURN_SECRET}
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-30}
      - MESSAGE_MAX_PER_CHAT=${MESSAGE_MAX_PER_CHAT:-1000}
    volumes:
      - voice-relay-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
  # Voice travels here: WebRTC needs UDP, which the web proxy in front of the relay cannot carry. Credentials come from the relay.
  # 3478 on this server already belongs to another project. Everyone is relayed by this same process, so the relay
  # addresses never leave the container: only the listening port is published.
  turn:
    image: coturn/coturn:4.7-alpine
    restart: unless-stopped
    mem_limit: 64m
    networks:
      voice-turn:
        ipv4_address: 172.29.99.10
    ports:
      - "3479:3479/udp"
      - "3479:3479/tcp"
    # No safe probe without credentials: keep it out of the resource health in Coolify.
    exclude_from_hc: true
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=voice.angatusistemas.com.br
      - --listening-port=3479
      - --min-port=49160
      - --max-port=49260
      - --no-multicast-peers
      # Everyone in a call is relayed by this same process, so it needs to reach only itself. Anything else would make it an open proxy.
      - --relay-ip=172.29.99.10
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --allowed-peer-ip=172.29.99.10
      - --max-bps=1500000
      - --user-quota=32
      - --total-quota=400
networks:
  voice-turn:
    ipam:
      config:
        - subnet: 172.29.99.0/24
volumes:
  voice-relay-data:
